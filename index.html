<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWebOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top">
        <div class="top-left-group">
            <span id="welcomeopen" class="top-bar-btn">MyWebOS</span>
            <span id="themeToggle" class="top-bar-btn">Theme</span>
        </div>
        <span id="timeElement">00:00:00</span>
    </div>

    <div id="desktopApps">
        <div id="welcomeIcon" class="icon-container">
            <div class="icon-box">🏠</div>
            <p class="icon-label">Home</p>
        </div>
        <div id="notesIcon" class="icon-container">
            <div class="icon-box">📝</div>
            <p class="icon-label">Notes</p>
        </div>
        <div id="clickerIcon" class="icon-container">
            <div class="icon-box">🎮</div>
            <p class="icon-label">Clicker</p>
        </div>
    </div>

    <div class="window" id="welcome">
        <div class="windowheader" id="welcomeheader">
            <div class="closebutton" id="welcomeclose"></div>
            <p class="headertext">Welcome</p>
            <div class="header-spacer"></div>
        </div>
        <div class="window-content">
            <h1>Welcome to my WebOS</h1>
            <p>This is just a quick webOS, I made.</p>
            <p>You can drag this window by the header bar.</p>
        </div>
    </div>

    <div class="window" id="notes">
        <div class="windowheader" id="notesheader">
            <div class="closebutton" id="notesclose"></div>
            <p class="headertext">Notes</p>
            <div class="header-spacer"></div>
        </div>
        <div class="window-content">
            <p id="noteText" class="note-editor" contenteditable="true" data-placeholder="Click here to edit this text note directly..."></p>
        </div>
    </div>

    <div class="window" id="clicker">
        <div class="windowheader" id="clickerheader">
            <div class="closebutton" id="clickerclose"></div>
            <p class="headertext">Cookie Clicker</p>
            <div class="header-spacer"></div>
        </div>
        <div class="window-content clicker-content">
            <h2 id="scoreDisplay">0</h2>
            <p id="cpsDisplay">Clicks per tap: +1</p>
            
            <button id="clickBtn">🍪</button>

            <div class="clicker-shop">
                <button id="upgradeBtn">Buy Upgrade (+1) - Cost: 10</button>
                <p id="upgradeStatus"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
